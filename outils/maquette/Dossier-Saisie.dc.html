<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Fenêtres de saisie, variante dossier</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #0f1512;
          }
          .app {
            --bureau: #23302a;
            --kraft: #d9bf8c;
            --papier: #fbfaf6;
            --encre: #1c1a17;
            --encre-2: #4a463e;
            --regle: #cfc8b6;
            --tampon: #4b2c9e;
            --sur-tampon: #ffffff;
            --ombre: #b39257;
            --ombre-portee: rgba(28, 26, 23, 0.3);
            --logo: #ede6d3;
            --sous-logo: #c9d2cb;
            --etiquette: #e9d7aa;
            --etiquette-survol: #f1e2bc;
            --voile: rgba(15, 21, 18, 0.55);
          }
          .app.nuit {
            --bureau: #0f1512;
            --kraft: #4a3b24;
            --papier: #1c221f;
            --encre: #ece6d6;
            --encre-2: #b5ae9e;
            --regle: #3a433e;
            --tampon: #ffb672;
            --sur-tampon: #1f1408;
            --ombre: #080b09;
            --ombre-portee: rgba(0, 0, 0, 0.6);
            --logo: #e6dcc2;
            --sous-logo: #9daea3;
            --etiquette: #5e4c2e;
            --etiquette-survol: #6e5a37;
            --voile: rgba(0, 0, 0, 0.6);
          }
          .lampe {
            all: unset;
            cursor: pointer;
            min-height: 44px;
            padding: 0 16px;
            border: 1.5px solid var(--sous-logo);
            border-radius: 999px;
            color: var(--logo);
            font-family: "IBM Plex Mono", monospace;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
          }
          .lampe[aria-pressed="true"] {
            background: var(--logo);
            color: var(--bureau);
            border-color: var(--logo);
          }
          .legende {
            font-family: "IBM Plex Mono", monospace;
            font-size: 13px;
            color: var(--sous-logo);
          }
          .mono {
            font-family: "IBM Plex Mono", monospace;
            font-size: 14px;
          }
          .dialogue {
            background: var(--papier);
            color: var(--encre);
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow:
              0 2px 0 var(--ombre),
              0 18px 40px var(--ombre-portee);
            box-sizing: border-box;
            border-top: 6px solid var(--kraft);
          }
          .dialogue h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            font-stretch: 80%;
            text-transform: uppercase;
            line-height: 1.05;
            border-bottom: 2px solid var(--encre);
            padding-bottom: 8px;
          }
          .etiquette-champ {
            font-family: "IBM Plex Mono", monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--encre-2);
          }
          .champ {
            min-height: 42px;
            border: 0;
            border-bottom: 2px solid var(--encre);
            background: transparent;
            color: var(--encre);
            font: inherit;
            font-size: 16px;
            padding: 0 2px;
            width: 100%;
            box-sizing: border-box;
          }
          .champ::placeholder {
            color: var(--encre-2);
          }
          .btn-tampon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 22px;
            border: 0;
            border-radius: 3px;
            background: var(--tampon);
            color: var(--sur-tampon);
            font: inherit;
            font-weight: 800;
            font-stretch: 85%;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
            outline: 2px solid var(--tampon);
            outline-offset: 3px;
            box-shadow:
              inset 0 0 0 3px var(--tampon),
              inset 0 0 0 4.5px var(--sur-tampon);
            transform: rotate(-1deg);
          }
          .btn-etiquette {
            position: relative;
            min-height: 44px;
            padding: 0 16px 0 36px;
            border: 1.5px solid var(--encre-2);
            border-radius: 3px 8px 8px 3px;
            background: var(--etiquette);
            color: var(--encre);
            font: inherit;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
          }
          .btn-etiquette::before {
            content: "";
            position: absolute;
            left: 10px;
            top: 50%;
            width: 8px;
            height: 8px;
            margin-top: -5.5px;
            border-radius: 50%;
            border: 1.5px solid currentColor;
            background: var(--papier);
          }
          .btn-etiquette::after {
            content: "";
            position: absolute;
            left: 26px;
            top: 7px;
            bottom: 7px;
            border-left: 1.5px dashed var(--encre-2);
          }
          .pied {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: flex-end;
            border-top: 1px solid var(--regle);
            padding-top: 14px;
          }
        </style>
      </helmet>
      <div
        class="{{classe}}"
        style="
          width: 1280px;
          min-height: 620px;
          box-sizing: border-box;
          padding: 22px 24px 28px;
          background: var(--bureau);
          font-family: Archivo, system-ui, sans-serif;
          color: var(--encre);
          display: flex;
          flex-direction: column;
          gap: 18px;
        "
      >
        <div style="display: flex; align-items: center; gap: 16px">
          <span class="legende"
            >Fenêtres de saisie (Dupliquer depuis les demandes, Classer
            depuis la recherche)</span
          >
          <button
            class="lampe"
            type="button"
            aria-pressed="{{pressee}}"
            onClick="{{basculer}}"
            style="margin-left: auto"
          >
            {{libelleLampe}}
          </button>
        </div>
        <div
          style="
            flex: 1;
            background: var(--voile);
            padding: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            align-items: flex-start;
            justify-content: center;
          "
        >
          <section
            class="dialogue"
            role="dialog"
            aria-modal="true"
            aria-labelledby="titre-dup"
            style="flex: 0 1 470px"
          >
            <h2 id="titre-dup">Dupliquer la demande</h2>
            <span class="mono" style="color: var(--encre-2)"
              >Copie de «&nbsp;Attaché, Paris et petite couronne&nbsp;»</span
            >
            <label style="display: flex; flex-direction: column; gap: 4px"
              ><span class="etiquette-champ">Nom de la nouvelle fiche</span>
              <input class="champ" type="text" value="attache-paris-copie" />
            </label>
            <label style="display: flex; flex-direction: column; gap: 4px"
              ><span class="etiquette-champ">Intitulé de la copie</span>
              <input class="champ" type="text" value="Attaché, Paris et petite couronne (copie)" />
            </label>
            <div class="pied">
              <button class="btn-etiquette" type="button">Annuler</button>
              <button class="btn-tampon" type="button" style="margin: 4px">
                Dupliquer
              </button>
            </div>
          </section>

          <section
            class="dialogue"
            role="dialog"
            aria-modal="true"
            aria-labelledby="titre-classer"
            style="flex: 0 1 470px"
          >
            <h2 id="titre-classer">Classer la demande</h2>
            <span class="mono" style="color: var(--encre-2)"
              >La demande de recherche actuelle est enregistrée sous un nom.</span
            >
            <label style="display: flex; flex-direction: column; gap: 4px"
              ><span class="etiquette-champ">Nom de la fiche</span>
              <input class="champ" type="text" placeholder="ex. dgal-paris" />
            </label>
            <label style="display: flex; flex-direction: column; gap: 4px"
              ><span class="etiquette-champ">Intitulé affiché</span>
              <input
                class="champ"
                type="text"
                placeholder="ex. Attaché, Paris et petite couronne"
              />
            </label>
            <div class="pied">
              <button class="btn-etiquette" type="button">Annuler</button>
              <button class="btn-tampon" type="button" style="margin: 4px">
                Créer
              </button>
            </div>
          </section>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre"},"$preview":{"width":1280,"height":620}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const choisi = this.state && typeof this.state.nuit === 'boolean' ? this.state.nuit : null;
          const nuit = choisi !== null ? choisi : (this.props.theme ?? 'sombre') !== 'clair';
          return {
            classe: nuit ? 'app nuit' : 'app',
            pressee: nuit ? 'true' : 'false',
            libelleLampe: nuit ? 'Bureau de jour' : 'Bureau de nuit',
            basculer: () => this.setState({ nuit: !nuit })
          };
        }
      }
    </script>
  </body>
</html>
