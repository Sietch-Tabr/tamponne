[project]
name = "tamponne"
version = "1.2.3"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pyside6-essentials>=6.12.0",
]

[project.gui-scripts]
tamponne = "src.gui.application:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.15"
files = ["src", "tests", "outils"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
