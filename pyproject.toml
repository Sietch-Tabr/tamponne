[project]
name = "tamponne"
version = "1.7.8"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pyside6-essentials>=6.12.0",
    "truststore>=0.10.5",
    "urllib3>=2.8.0",
]

[project.gui-scripts]
tamponne = "src.gui.application:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# uv ne télécharge que les Python qu'il connaît : 0.13.0 pour Python 3.15.
# Les lanceurs mettent uv à jour quand cette borne n'est pas atteinte.
required-version = ">=0.13.0"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.15"
files = ["src", "tests", "outils"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.15"
# Le code propre à Windows (lanceur, raccourci) est analysé, pas grisé comme
# inaccessible sur le poste de développement.
pythonPlatform = "All"
